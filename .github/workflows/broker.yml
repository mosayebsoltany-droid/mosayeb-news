name: Broker CI and image delivery
on:
  push:
    branches: [real-estate-broker]
    tags: ['broker-v*']
  pull_request:
    branches: [real-estate-broker]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build and verify Docker container
        run: |
          trap 'docker compose logs; docker compose down --volumes' EXIT
          docker compose up --build --detach --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/docs >/dev/null
          docker compose exec -T broker python -c "import sqlite3; db = sqlite3.connect('file:/data/broker.db?mode=ro', uri=True); assert {'users', 'audit_logs'} <= {r[0] for r in db.execute('SELECT name FROM sqlite_master')}"
      - name: Archive the tested image
        run: docker save real-estate-broker:local | gzip > broker-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: broker-docker-image
          path: broker-image.tar.gz
          retention-days: 30

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: broker-docker-image
      - name: Publish the tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i broker-image.tar.gz
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/broker-v* ]]; then tag="$GITHUB_REF_NAME"; fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/real-estate-broker-system:$tag"
          docker tag real-estate-broker:local "$image"
          docker push "$image"
          echo "Published \`$image\`" >> "$GITHUB_STEP_SUMMARY"
