name: Broker CI and image delivery
on:
  push:
    branches: [real-estate-broker]
    tags: ['broker-v*']
  pull_request:
    branches: [real-estate-broker]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: docker build -t broker:test .
      - name: Smoke test Docker image
        run: |
          docker run -d --name broker -p 127.0.0.1:8000:8000 broker:test
          trap 'docker logs broker; docker rm -f broker' EXIT
          curl --fail --retry 12 --retry-connrefused --retry-delay 2 http://127.0.0.1:8000/health

  publish:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/broker-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish versioned image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/real-estate-broker-system:$GITHUB_REF_NAME"
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$image" .
          docker push "$image"
