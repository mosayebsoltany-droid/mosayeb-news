name: Broker CI and image delivery
on:
  push:
    branches: [real-estate-broker]
    tags: ['broker-v*']
  pull_request:
    branches: [real-estate-broker]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: ci-disposable-broker-password
          POSTGRES_DB: broker_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U broker -d broker_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://broker:ci-disposable-broker-password@127.0.0.1:5432/broker_ci
      - name: Build and verify Docker container
        run: |
          trap 'docker compose logs; docker compose down --volumes' EXIT
          docker compose up --build --detach --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error http://127.0.0.1:8000/docs >/dev/null
          docker compose exec -T broker python -c "import sqlite3; db = sqlite3.connect('file:/data/broker.db?mode=ro', uri=True); assert {'users', 'audit_logs'} <= {r[0] for r in db.execute('SELECT name FROM sqlite_master')}"
      - name: Verify isolated staging
        env:
          BROKER_JWT_SECRET: ci-only-staging-secret-for-isolated-container
        run: |
          trap 'docker compose -f compose.staging.yaml logs; docker compose -f compose.staging.yaml down --volumes' EXIT
          docker compose -f compose.staging.yaml up --build --detach --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:8001/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST http://127.0.0.1:8001/api/demo/requests)" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/services/track/example)" = 401
      - name: Verify PostgreSQL orchestration and optional Redis
        env:
          BROKER_JWT_SECRET: ci-disposable-compose-signing-secret-000000
          BROKER_POSTGRES_PASSWORD: ci_disposable_compose_password
          BROKER_MOCK_FAILURE_RATE: "0"
        run: |
          trap 'docker compose -f compose.postgres.yaml --profile cache logs --tail 100; docker compose -f compose.postgres.yaml --profile cache down --volumes' EXIT
          docker compose -f compose.postgres.yaml --profile cache up --build --detach --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:8002/ready
          docker compose -f compose.postgres.yaml exec -T broker python -c "import os,sys; assert os.getuid() == 10001; assert sys.prefix == '/opt/venv'; assert not os.path.exists('/wheels')"
          docker compose -f compose.postgres.yaml exec -T redis redis-cli ping | grep PONG
          docker compose -f compose.postgres.yaml exec -T broker python -m alembic check
          docker compose -f compose.postgres.yaml exec -T broker python - < scripts/smoke_postgres.py
          docker compose -f compose.postgres.yaml stop db
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8002/ready)" = 503
          curl --fail --silent --show-error http://127.0.0.1:8002/live
          docker compose -f compose.postgres.yaml start db
          curl --fail --silent --show-error --retry 20 --retry-delay 1 --retry-all-errors http://127.0.0.1:8002/ready
          docker compose -f compose.postgres.yaml logs --no-log-prefix broker > /tmp/broker-json.log
          python -c 'import json; lines=open("/tmp/broker-json.log").readlines(); logs=[json.loads(s) for s in lines if s.startswith("{")]; assert any(s.get("message")=="request_completed" for s in logs)'
      - name: Archive the tested image
        run: docker save real-estate-broker:local | gzip > broker-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: broker-docker-image
          path: broker-image.tar.gz
          retention-days: 30

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: broker-docker-image
      - name: Publish the tested image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker load -i broker-image.tar.gz
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="sha-$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/tags/broker-v* ]]; then tag="$GITHUB_REF_NAME"; fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/real-estate-broker-system:$tag"
          docker tag real-estate-broker:local "$image"
          docker push --platform linux/amd64 "$image"
          echo "Published \`$image\`" >> "$GITHUB_STEP_SUMMARY"
