name: broker-staging
services:
  broker:
    build: .
    image: real-estate-broker:staging
    environment:
      BROKER_RATE_LIMIT_STORAGE_URI: ${BROKER_RATE_LIMIT_STORAGE_URI:-memory://}
      BROKER_ACCESS_TOKEN_EXPIRE_MINUTES: ${BROKER_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      BROKER_MOCK_REGISTRY_URL: ${BROKER_MOCK_REGISTRY_URL:-http://mock-registry/submit}
      BROKER_REGISTRY_TIMEOUT_SECONDS: ${BROKER_REGISTRY_TIMEOUT_SECONDS:-5}
      BROKER_AUTO_CREATE_TABLES: ${BROKER_AUTO_CREATE_TABLES:-true}
      BROKER_DATABASE_URL: sqlite:////data/broker.db
      BROKER_JWT_SECRET: ${BROKER_JWT_SECRET:?Set a staging JWT secret}
      BROKER_ALLOWED_HOSTS: ${BROKER_ALLOWED_HOSTS:-localhost,127.0.0.1}
      BROKER_CORS_ORIGINS: ${BROKER_CORS_ORIGINS:-}
      BROKER_ENABLE_DEMO: "false"
      BROKER_MOCK_FAILURE_RATE: "0.2"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - staging-data:/data
    restart: unless-stopped

volumes:
  staging-data:
